plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group
version = mod_version

base {
    archivesName = mod_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neoforge_version

    mods {
        eyrax_apothic_animals {
            sourceSet sourceSets.main
        }
    }

    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
}

repositories {
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top'
    }
    maven {
        name = 'Shadows of Fire'
        url = 'https://maven.shadowsoffire.dev/releases'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

dependencies {
    implementation "dev.shadowsoffire:Placebo:${minecraft_version}-${placebo_version}"
    implementation "dev.shadowsoffire:ApothicAttributes:${minecraft_version}-${apothic_attributes_version}"
    implementation "dev.shadowsoffire:Apotheosis:${minecraft_version}-${apotheosis_version}"

    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
    runtimeOnly "dev.shadowsoffire:ApothicSpawners:${minecraft_version}-${apothic_spawners_version}"
    runtimeOnly "dev.shadowsoffire:ApothicEnchanting:${minecraft_version}-${apothic_enchanting_version}"

    // Critter Armory is required at runtime but is not needed to compile this
    // addon because the integration uses item tags. Put its JAR in run/mods
    // when launching a development client or server.
    runtimeOnly fileTree(dir: 'run/mods', include: ['critterarmory*.jar'])
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
            'Specification-Title'     : mod_display_name,
            'Specification-Vendor'    : 'EYRAX',
            'Specification-Version'   : mod_version,
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'EYRAX'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
