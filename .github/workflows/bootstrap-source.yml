name: Publish source tree

on:
  push:
    paths:
      - EYRAX-Apothic-Animals-source-upload.zip

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack source
        run: |
          mkdir source-stage
          unzip -q EYRAX-Apothic-Animals-source-upload.zip -d source-stage
          cp -a source-stage/. .
          rm -rf source-stage
          rm EYRAX-Apothic-Animals-source-upload.zip
          rm .github/workflows/bootstrap-source.yml

      - name: Commit source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish EYRAX Apothic Animals 1.1.0 source"
          git push
